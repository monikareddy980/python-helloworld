name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history so SonarCloud can analyze blame information.
          # This is necessary for accurate issue attribution.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8' # Or the version your project uses

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          # The URL of your SonarQube server VM (e.g., http://your-vm-ip:9000)
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # This token needs to be created in your SonarQube server and stored in GitHub Secrets
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
